[workspace]
members = [
  "crates/nexus-core",
  "crates/nexus-crypto",
  "crates/nexus-transport",
  "crates/nexus-discovery",
  "crates/nexus-services",
  "crates/nexus-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
clap = { version = "4", features = ["cargo", "derive"] }
rand = "0.8"
hex = "0.4"
sha2 = "0.10"
hkdf = "0.12"
x25519-dalek = { version = "2", features = ["static_secrets"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.2"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
